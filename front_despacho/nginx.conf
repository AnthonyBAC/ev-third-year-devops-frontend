server {
    # Puerto no privilegiado: la imagen nginx-unprivileged corre como
    # usuario no root, por eso escucha en 8080 dentro del contenedor.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia el backend de Ventas
    location /api/v1/ventas {
        proxy_pass http://${BACKEND_VENTAS_HOST}:8080/api/v1/ventas;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy hacia el backend de Despachos
    location /api/v1/despachos {
        proxy_pass http://${BACKEND_DESPACHOS_HOST}:8081/api/v1/despachos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* \.(js|css|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
