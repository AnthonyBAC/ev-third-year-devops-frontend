name: CI/CD - Build, Push & Deploy Frontend

on:
  push:
    branches:
      - deploy

jobs:
  # ──────────────────────────────────────
  # Build y push de la imagen del frontend
  # ──────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build y push front-despacho
        uses: docker/build-push-action@v5
        with:
          context: ./front_despacho
          file: ./front_despacho/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/front-despacho:latest
            ${{ secrets.DOCKER_USERNAME }}/front-despacho:${{ github.sha }}

  # ──────────────────────────────────────────────────────────
  # Deploy a EC2 Frontend con docker compose
  # 1) Copia docker-compose.yml a la instancia
  # 2) Hace docker compose pull + up -d (usa imagen de Docker Hub)
  # ──────────────────────────────────────────────────────────
  deploy-frontend:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Copiar compose a EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_FRONTEND }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "~/app-frontend"

      - name: Levantar frontend con docker compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_FRONTEND }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 5m
          script_stop: true
          # Pasa los valores al shell remoto para que docker compose
          # los sustituya en ${...} dentro del docker-compose.yml
          envs: DOCKER_USERNAME,BACKEND_PRIVATE_IP
          script: |
            set -eu
            echo "Verificar docker compose v2"
            docker compose version

            cd ~/app-frontend

            echo "Pre-cleanup"
            docker container prune -f || true
            docker image prune -f || true
            df -h /

            echo "Pull imagen publicada"
            docker compose pull

            echo "Limpiar contenedor heredado del deploy anterior (docker run, sin compose)"
            proj=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' frontend 2>/dev/null || true)
            if [ -n "$(docker ps -aq -f name=^frontend$)" ] && [ -z "$proj" ]; then
              echo "  removiendo contenedor legacy frontend"
              docker rm -f frontend || true
            fi

            echo "Levantar frontend"
            docker compose up -d --remove-orphans

            echo "Post-cleanup (imagenes viejas sin uso)"
            docker image prune -af || true
            df -h /

            echo "Estado del frontend"
            docker compose ps
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          BACKEND_PRIVATE_IP: ${{ secrets.BACKEND_PRIVATE_IP }}
