name: CI/CD - Build, Push & Deploy Frontend

on:
  push:
    branches:
      - deploy

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 211125593312.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: front-despacho

jobs:
  # ──────────────────────────────────────
  # Build y push de la imagen del frontend
  # ──────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push front-despacho
        uses: docker/build-push-action@v5
        with:
          context: ./front_despacho
          file: ./front_despacho/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

  # ──────────────────────────────────────────────────────────
  # Deploy a EC2 Frontend con docker compose
  # ──────────────────────────────────────────────────────────
  deploy-frontend:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Copiar compose a EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_FRONTEND }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "~/app-frontend"

      - name: Levantar frontend con docker compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_FRONTEND }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 5m
          script_stop: true
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN,BACKEND_PRIVATE_IP
          script: |
            set -eu
            echo "Verificar docker compose v2"
            docker compose version

            cd ~/app-frontend

            echo "Pre-cleanup"
            docker container prune -f || true
            docker image prune -f || true
            df -h /

            echo "Login en ECR desde la EC2"
            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin 211125593312.dkr.ecr.us-east-1.amazonaws.com

            echo "Pull imagen publicada"
            docker compose pull

            echo "Limpiar contenedor heredado del deploy anterior"
            proj=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' frontend 2>/dev/null || true)
            if [ -n "$(docker ps -aq -f name=^frontend$)" ] && [ -z "$proj" ]; then
              echo "  removiendo contenedor legacy frontend"
              docker rm -f frontend || true
            fi

            echo "Levantar frontend"
            docker compose up -d --remove-orphans

            echo "Post-cleanup"
            docker image prune -af || true
            df -h /

            echo "Estado del frontend"
            docker compose ps
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          BACKEND_PRIVATE_IP: ${{ secrets.BACKEND_PRIVATE_IP }}
